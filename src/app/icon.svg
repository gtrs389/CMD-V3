<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="CMD">
  <!-- Marca do CMD: um "M" de Mobilizacao desenhado como rede (cada vertice
       e uma pessoa), com o ponto dourado do voto no meio. A versao animada
       fica em src/components/layout/BrandMark.tsx, com o mesmo desenho. -->
  <defs>
    <linearGradient id="cmd-fundo" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f9bff" />
      <stop offset="0.55" stop-color="#2563eb" />
      <stop offset="1" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="cmd-luz" x1="24" y1="0" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cmd-ouro" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe9a8" />
      <stop offset="0.55" stop-color="#f2c14e" />
      <stop offset="1" stop-color="#e0a426" />
    </radialGradient>
    <clipPath id="cmd-recorte">
      <rect width="48" height="48" rx="13" />
    </clipPath>
  </defs>

  <g clip-path="url(#cmd-recorte)">
    <rect width="48" height="48" fill="url(#cmd-fundo)" />
    <rect width="48" height="26" fill="url(#cmd-luz)" />
    <circle cx="24" cy="27" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2" />
  </g>

  <path d="M11 34 L17.5 15 L24 27.5 L30.5 15 L37 34" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

  <g fill="#ffffff">
    <circle cx="11" cy="34" r="3.3" />
    <circle cx="17.5" cy="15" r="3.3" />
    <circle cx="30.5" cy="15" r="3.3" />
    <circle cx="37" cy="34" r="3.3" />
  </g>

  <circle cx="24" cy="27.5" r="4.4" fill="url(#cmd-ouro)" stroke="#0f1e35" stroke-opacity="0.35" stroke-width="0.8" />
</svg>
